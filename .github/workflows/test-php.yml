# eustasy/.Normal 4.0beta13
name: "Test: PHP"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.php"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
      - "phpunit.xml.dist"
      - ".github/workflows/test-php.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.php"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml"
      - "phpunit.xml.dist"
      - ".github/workflows/test-php.yml"

permissions:
  contents: read

jobs:
  test-php:
    name: PHPUnit + coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4", "8.5", "8.6"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: eustasy/.normal/php/setup@v4
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov

      # Insert project-specific steps here — fixtures, config files, migrations.

      - uses: eustasy/.normal/php/test@v4
        with:
          coverage-token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          upload: ${{ matrix.php-version == '8.6' }}
